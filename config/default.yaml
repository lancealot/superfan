# superfan configuration
#
# Before enabling the service:
#   1. superfan sensors      list the sensor names that exist on this machine
#   2. edit the zones below  so every pattern matches something
#   3. superfan check        confirm it
#   4. superfan calibrate    measure the fans and find each zone's minimum duty
#   5. superfan run --dry-run --once
#
# Sensor patterns look like source:name, accept * and ? wildcards, and ignore case:
#   ipmi:CPU Temp               a BMC sensor
#   hwmon:k10temp/Tctl          a kernel hwmon sensor, written chip/label
#   hwmon:nvme@nvme0/Composite  the same, pinned to one device
#   command:gpu0                a command defined under sources.command

# Seconds between control cycles.
interval: 10

# A temperature must fall this many degrees before a zone slows down again.
hysteresis: 3

sources:
  ipmi: true
  hwmon: true
  # Any command that prints a temperature in degrees C, one per line.
  # command:
  #   gpu0: nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits -i 0

# A zone is one BMC fan zone. On most Supermicro boards BMC zone 0 drives the
# numbered headers (FAN1, FAN2, ...) and zone 1 the lettered ones (FANA, FANB, ...).
# Name each zone after what its fans cool. Every input has its own curve of
# [temperature in C, duty in %] points; the zone runs at the highest duty any input asks for.
zones:
  cpu:
    bmc_zone: 1
    inputs:
      - sensors: ["ipmi:CPU*Temp"]
        curve: [[50, 20], [65, 40], [75, 70], [80, 100]]
        critical: 85          # at or above this, every zone goes to full speed
      - sensors: ["ipmi:*VRM*"]
        curve: [[60, 20], [80, 60], [95, 100]]
        required: false       # do not fail safe if this board has no such sensor

  chassis:
    bmc_zone: 0
    inputs:
      - sensors: ["ipmi:System Temp", "ipmi:Peripheral Temp"]
        curve: [[40, 20], [55, 40], [65, 70], [70, 100]]
        critical: 75
      - sensors: ["ipmi:*DIMM*"]
        curve: [[50, 20], [70, 60], [80, 100]]
        required: false
      - sensors: ["hwmon:nvme/*"]
        curve: [[45, 20], [60, 50], [70, 100]]
        required: false
      # A graphics card cooled by the chassis fans:
      # - sensors: ["command:gpu0"]          # NVIDIA, with the command above
      #   curve: [[50, 25], [70, 60], [85, 100]]
      # - sensors: ["hwmon:amdgpu/*"]        # AMD
      #   curve: [[50, 25], [70, 60], [85, 100]]

safety:
  failsafe_duty: 100   # duty used when a sensor is missing, a fan fails or a temperature is critical
  fault_hold: 60       # seconds to stay at the failsafe duty after such a condition clears
  max_failures: 3      # give up (and hand the fans back to the BMC) after this many failed cycles

bmc:
  command: ipmitool
  timeout: 30
  # Fan mode to hand back to the BMC on exit: previous, standard, optimal or heavy_io.
  exit_mode: previous

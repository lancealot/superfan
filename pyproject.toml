[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "superfan"
version = "0.2.0"
description = "Temperature-driven fan control for Supermicro servers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.1"]
authors = [{ name = "Lance" }]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
superfan = "superfan.cli:main"

[project.urls]
Homepage = "https://github.com/lancealot/superfan"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
